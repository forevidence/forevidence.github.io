name: Validate Weekly Briefing data

# Validation gate for weekly-briefing/data/** — schema, immutability,
# approval provenance, sanitization, empty pending/, citation resolution.
# Companion to validate-briefs.yml (Daily Brief). Make this a required
# status check on main.

on:
  pull_request:
    paths:
      - "weekly-briefing/**"
      - "weekly-briefing.js"
      - "weekly-briefing.html"
      - "weekly-briefing-archive.html"
      - ".github/scripts/validate_weekly.py"
      - ".github/scripts/generate_weekly_feed.py"
      - ".github/workflows/validate-weekly-briefing.yml"
  push:
    branches: [main]
    paths:
      - "weekly-briefing/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate weekly briefing data
        run: |
          python .github/scripts/validate_weekly.py \
            --base-ref "${{ steps.base.outputs.ref }}" \
            --check-urls

      # main is PR-only, so feed.xml must be committed with the publish PR
      # rather than pushed by a bot afterward. The generator is deterministic;
      # a dirty diff here means the PR forgot to regenerate the feed.
      - name: Check Atom feed is in sync
        run: |
          python .github/scripts/generate_weekly_feed.py
          if ! git diff --exit-code -- weekly-briefing/feed.xml; then
            echo "::error::weekly-briefing/feed.xml is stale. Run: python .github/scripts/generate_weekly_feed.py and commit the result."
            exit 1
          fi
